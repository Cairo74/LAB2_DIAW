<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 820" width="100%" height="100%" style="background-color:#0b1329; font-family:'Segoe UI',monospace,sans-serif;">
  <defs>
    <filter id="shadowClass" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <text x="575" y="40" text-anchor="middle" fill="#10b981" font-size="22" font-family="'Segoe UI',sans-serif" font-weight="bold">DIAGRAMA DE CLASSES - MODELO DE DOMÍNIO</text>
  <text x="575" y="65" text-anchor="middle" fill="#94a3b8" font-size="13" font-family="'Segoe UI',sans-serif">Sistema de Gestão de Aluguel de Carros | Spring Boot &amp; Supabase (PostgreSQL)</text>

  <!-- CLASSE USUARIO -->
  <g transform="translate(40, 100)" filter="url(#shadowClass)">
    <rect width="240" height="150" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 0 0 L 240 0 L 240 32 L 0 32 Z" fill="#3b82f6" rx="8"/>
    <text x="120" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">&lt;&lt;Entity&gt;&gt; Usuario</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="11">- id: Long [PK]</text>
    <text x="12" y="70" fill="#cbd5e1" font-size="11">- email: String [Unique]</text>
    <text x="12" y="88" fill="#cbd5e1" font-size="11">- senha: String (BCrypt)</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="11">- tipoPerfil: RoleEnum</text>
    <line x1="0" y1="116" x2="240" y2="116" stroke="#334155" stroke-width="1"/>
    <text x="12" y="134" fill="#93c5fd" font-size="11">+ autenticar(): boolean</text>
  </g>

  <!-- CLASSE CLIENTE -->
  <g transform="translate(40, 310)" filter="url(#shadowClass)">
    <rect width="270" height="230" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <path d="M 0 0 L 270 0 L 270 32 L 0 32 Z" fill="#10b981" rx="8"/>
    <text x="135" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">&lt;&lt;Entity&gt;&gt; Cliente</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="11">- id: Long [PK]</text>
    <text x="12" y="70" fill="#cbd5e1" font-size="11">- rg: String</text>
    <text x="12" y="88" fill="#cbd5e1" font-size="11">- cpf: String [Unique]</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="11">- nome: String</text>
    <text x="12" y="124" fill="#cbd5e1" font-size="11">- endereco: String</text>
    <text x="12" y="142" fill="#cbd5e1" font-size="11">- profissao: String</text>
    <text x="12" y="160" fill="#cbd5e1" font-size="11">- usuario: Usuario [1..1]</text>
    <line x1="0" y1="172" x2="270" y2="172" stroke="#334155" stroke-width="1"/>
    <text x="12" y="190" fill="#6ee7b7" font-size="11">+ getRendaTotal(): BigDecimal</text>
    <text x="12" y="208" fill="#6ee7b7" font-size="11">+ addRendimento(rend: Rendimento)</text>
  </g>

  <!-- CLASSE RENDIMENTO EMPREGADOR -->
  <g transform="translate(40, 590)" filter="url(#shadowClass)">
    <rect width="270" height="150" rx="8" fill="#1e293b" stroke="#059669" stroke-width="2"/>
    <path d="M 0 0 L 270 0 L 270 32 L 0 32 Z" fill="#059669" rx="8"/>
    <text x="135" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">RendimentoEmpregador</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="11">- id: Long [PK]</text>
    <text x="12" y="70" fill="#cbd5e1" font-size="11">- empresaEmpregadora: String</text>
    <text x="12" y="88" fill="#cbd5e1" font-size="11">- rendimentoMensal: BigDecimal</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="11">- cliente: Cliente [N..1]</text>
    <line x1="0" y1="116" x2="270" y2="116" stroke="#334155" stroke-width="1"/>
    <text x="12" y="134" fill="#6ee7b7" font-size="11">+ validarLimite3PorCliente()</text>
  </g>

  <!-- CLASSE AUTOMOVEL -->
  <g transform="translate(800, 310)" filter="url(#shadowClass)">
    <rect width="290" height="230" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 0 0 L 290 0 L 290 32 L 0 32 Z" fill="#8b5cf6" rx="8"/>
    <text x="145" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">&lt;&lt;Entity&gt;&gt; Automovel</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="11">- id: Long [PK]</text>
    <text x="12" y="70" fill="#cbd5e1" font-size="11">- matricula: String [Unique]</text>
    <text x="12" y="88" fill="#cbd5e1" font-size="11">- ano: Integer</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="11">- marca: String</text>
    <text x="12" y="124" fill="#cbd5e1" font-size="11">- modelo: String</text>
    <text x="12" y="142" fill="#cbd5e1" font-size="11">- placa: String [Unique]</text>
    <text x="12" y="160" fill="#cbd5e1" font-size="11">- tipoProprietario: ProprietarioEnum</text>
    <text x="12" y="178" fill="#cbd5e1" font-size="11">- valorDiaria: BigDecimal</text>
    <line x1="0" y1="190" x2="290" y2="190" stroke="#334155" stroke-width="1"/>
    <text x="12" y="210" fill="#c4b5fd" font-size="11">+ verificarDisponibilidade(): boolean</text>
  </g>

  <!-- CLASSE PEDIDO ALUGUEL -->
  <g transform="translate(420, 270)" filter="url(#shadowClass)">
    <rect width="280" height="310" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 0 0 L 280 0 L 280 32 L 0 32 Z" fill="#f59e0b" rx="8"/>
    <text x="140" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">&lt;&lt;Entity&gt;&gt; PedidoAluguel</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="11">- id: Long [PK]</text>
    <text x="12" y="70" fill="#cbd5e1" font-size="11">- dataPedido: LocalDateTime</text>
    <text x="12" y="88" fill="#cbd5e1" font-size="11">- dataInicio: LocalDate</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="11">- dataFim: LocalDate</text>
    <text x="12" y="124" fill="#cbd5e1" font-size="11">- valorTotal: BigDecimal</text>
    <text x="12" y="142" fill="#cbd5e1" font-size="11">- status: StatusPedidoEnum</text>
    <text x="12" y="160" fill="#cbd5e1" font-size="11">- parecerAgente: String</text>
    <text x="12" y="178" fill="#cbd5e1" font-size="11">- cliente: Cliente [N..1]</text>
    <text x="12" y="196" fill="#cbd5e1" font-size="11">- automovel: Automovel [N..1]</text>
    <line x1="0" y1="210" x2="280" y2="210" stroke="#334155" stroke-width="1"/>
    <text x="12" y="230" fill="#fde68a" font-size="11">+ cancelarPedido()</text>
    <text x="12" y="248" fill="#fde68a" font-size="11">+ modificarPedido(datas: Dates)</text>
    <text x="12" y="266" fill="#fde68a" font-size="11">+ avaliarFinanceiramente(status, parecer)</text>
    <text x="12" y="284" fill="#fde68a" font-size="11">+ executarContrato()</text>
  </g>

  <!-- CLASSE CONTRATO CREDITO -->
  <g transform="translate(420, 630)" filter="url(#shadowClass)">
    <rect width="280" height="150" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="2"/>
    <path d="M 0 0 L 280 0 L 280 32 L 0 32 Z" fill="#ec4899" rx="8"/>
    <text x="140" y="21" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">ContratoCredito</text>
    <text x="12" y="52" fill="#cbd5e1" font-size="11">- id: Long [PK]</text>
    <text x="12" y="70" fill="#cbd5e1" font-size="11">- bancoAgente: String</text>
    <text x="12" y="88" fill="#cbd5e1" font-size="11">- valorFinanciado: BigDecimal</text>
    <text x="12" y="106" fill="#cbd5e1" font-size="11">- numeroParcelas: Integer</text>
    <text x="12" y="124" fill="#cbd5e1" font-size="11">- statusAprovacao: StatusCredito</text>
    <line x1="0" y1="132" x2="280" y2="132" stroke="#334155" stroke-width="1"/>
    <text x="12" y="144" fill="#fbcfe8" font-size="11">+ calcularParcela(): BigDecimal</text>
  </g>

  <!-- RELACIONAMENTOS -->
  <!-- Usuario -> Cliente -->
  <line x1="160" y1="250" x2="160" y2="310" stroke="#38bdf8" stroke-width="2"/>
  <text x="170" y="285" fill="#94a3b8" font-size="11">1..1</text>

  <!-- Cliente -> Rendimento -->
  <line x1="175" y1="540" x2="175" y2="590" stroke="#10b981" stroke-width="2"/>
  <text x="185" y="565" fill="#94a3b8" font-size="11">1..* (máx 3)</text>

  <!-- Cliente -> Pedido -->
  <line x1="310" y1="420" x2="420" y2="420" stroke="#f59e0b" stroke-width="2"/>
  <text x="320" y="412" fill="#94a3b8" font-size="11">1</text>
  <text x="400" y="412" fill="#94a3b8" font-size="11">0..*</text>

  <!-- Pedido -> Automovel -->
  <line x1="700" y1="420" x2="800" y2="420" stroke="#f59e0b" stroke-width="2"/>
  <text x="710" y="412" fill="#94a3b8" font-size="11">0..*</text>
  <text x="780" y="412" fill="#94a3b8" font-size="11">1</text>

  <!-- Pedido -> ContratoCredito -->
  <line x1="560" y1="580" x2="560" y2="630" stroke="#ec4899" stroke-width="2"/>
  <text x="570" y="605" fill="#94a3b8" font-size="11">0..1 (Opcional)</text>
</svg>